
name: backtest-v231

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-v231
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run diagnostic V2.3.1 backtest
        run: python -u backtest.py

      - name: Upload V2.3.1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v231-results
          path: |
            backtest_report_v231.json
            backtest_trades_v231.csv
          if-no-files-found: warn
          retention-days: 30
