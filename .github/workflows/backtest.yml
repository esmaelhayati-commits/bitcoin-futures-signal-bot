```yaml
name: backtest-v23

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V2.3 backtest
        run: python backtest.py

      - name: Upload V2.3 backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v23-results
          path: |
            backtest_report_v23.json
            backtest_trades_v23.csv
          if-no-files-found: error
          retention-days: 30
```
