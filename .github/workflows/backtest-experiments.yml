name: backtest-experiments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-experiments
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run independent A/B/C experiments
        run: python -u backtest_experiments.py

      - name: Upload experiment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-experiments-results
          path: |
            backtest_report_*.json
            backtest_trades_*.csv
            backtest_experiment_comparison.json
            backtest_experiment_comparison.csv
          if-no-files-found: warn
          retention-days: 30
