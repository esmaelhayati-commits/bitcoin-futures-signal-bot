name: Run Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs automatically every 15 minutes (UTC)
  workflow_dispatch:       # Allows manual trigger from the Actions tab

permissions:
  contents: write          # Required to commit and push updated JSON state files

concurrency:
  group: trading-bot-run
  cancel-in-progress: false # Prevents overlapping runs if GitHub queue delays a job

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install ccxt pandas numpy requests python-dotenv
          fi

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
        run: python bot.py

      - name: Persist State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f live_trader_state.json signal_guard_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bot state [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi
