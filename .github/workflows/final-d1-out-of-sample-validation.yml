name: final-d1-out-of-sample-validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-d1-out-of-sample-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run final D1 out-of-sample validation
        run: python -u backtest_final_d1_oos.py
      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-d1-out-of-sample-results
          path: |
            final_d1_oos_report.json
            final_d1_oos_summary.json
            final_d1_oos_trades.csv
          if-no-files-found: warn
          retention-days: 30
